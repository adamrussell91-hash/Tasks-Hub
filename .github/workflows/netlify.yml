name: Deploy Netlify Functions

# Deploys artasks-hub (tasks-api) when NETLIFY_AUTH_TOKEN is present.
# Site id is public for this hub; only the personal access token is secret.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # artasks-hub (not secret). Optional secret NETLIFY_SITE_ID overrides if the site is recreated.
  NETLIFY_SITE_ID: c6696619-f478-4ac1-b0cd-1e4cfd3101df

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build SPA for same-origin API host
        run: npx vite build && node scripts/copy-spa-fallback.mjs
        env:
          VITE_API_BASE_URL: https://tasks-api.adam-russell.com

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID || env.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::warning::NETLIFY_AUTH_TOKEN secret missing — skip Functions deploy. Create a Netlify personal access token (User settings → Applications → Personal access tokens), add it as the GitHub secret NETLIFY_AUTH_TOKEN, then re-run this workflow. Or click Deploy of main in the Netlify UI for artasks-hub."
            exit 0
          fi
          if [ -n "${{ secrets.NETLIFY_SITE_ID }}" ]; then
            export NETLIFY_SITE_ID="${{ secrets.NETLIFY_SITE_ID }}"
          fi
          npx --yes netlify-cli@23 deploy --prod --dir=dist --functions=netlify/functions --message "main $(git rev-parse --short HEAD)"

      - name: Seed Blobs (idempotent)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ env.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "skip seed — no NETLIFY_AUTH_TOKEN"
            exit 0
          fi
          if [ -n "${{ secrets.NETLIFY_SITE_ID }}" ]; then
            export NETLIFY_SITE_ID="${{ secrets.NETLIFY_SITE_ID }}"
          fi
          npm run seed:blobs
