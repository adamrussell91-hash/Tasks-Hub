name: Deploy Netlify Functions

# Deploys artasks-hub (tasks-api) when secrets are present.
# Required repo secrets: NETLIFY_AUTH_TOKEN, NETLIFY_SITE_ID

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::warning::NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID secrets missing — skip Functions deploy. Add them under repo Settings → Secrets, or deploy site artasks-hub from the Netlify UI."
            exit 0
          fi
          npx --yes netlify-cli@23 deploy --prod --dir=netlify/public --functions=netlify/functions --message "main $(git rev-parse --short HEAD)"

      - name: Seed Blobs (idempotent)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "skip seed — no Netlify secrets"
            exit 0
          fi
          npm run seed:blobs
