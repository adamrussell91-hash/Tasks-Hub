<!-- Locked passphrase gate. Only brand + supporting copy may change per hub.
     No hub tile / .sign-in__mark / .hub-mark. Prefer form.sign-in__card
     (field siblings of brand/title). Load:
     tokens.css → overlays.css → actions.css → sign-in.css -->
<div class="sign-in">
  <form class="sign-in__card" method="post" action="#">
    <div class="sign-in__haze" aria-hidden="true">
      <span class="sign-in__haze-mist"></span>
      <span class="sign-in__bubble"></span>
      <span class="sign-in__bubble"></span>
      <span class="sign-in__bubble"></span>
      <span class="sign-in__bubble"></span>
      <span class="sign-in__bubble"></span>
      <span class="sign-in__sparkle"></span>
      <span class="sign-in__sparkle"></span>
      <span class="sign-in__sparkle"></span>
      <span class="sign-in__sparkle"></span>
      <span class="sign-in__sparkle"></span>
      <span class="sign-in__sparkle"></span>
    </div>
    <p class="sign-in__brand">Hub name</p>
    <h1 class="sign-in__title">Sign in</h1>
    <p class="sign-in__supporting">One line of purpose.</p>
    <div class="sign-in__field">
      <label class="sign-in__label" for="sign-in-passphrase">Passphrase</label>
      <input
        class="sign-in__input"
        id="sign-in-passphrase"
        name="passphrase"
        type="password"
        required
        autocomplete="current-password"
      />
    </div>
    <p class="sign-in__error" role="alert" hidden></p>
    <button class="btn btn--primary sign-in__submit" type="submit">Sign in</button>
  </form>
</div>
