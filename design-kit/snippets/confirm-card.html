<section class="confirm-card" role="region" aria-label="Confirm change">
  <p class="page-header__eyebrow">Proposed write</p>
  <h2 class="page-header__title" style="font-size: var(--text-lg)">What will change</h2>
  <p class="page-header__supporting">Short summary. Do not apply until Confirm.</p>
  <div class="confirm-card__actions">
    <button class="btn btn--ghost" type="button">Discard</button>
    <button class="btn btn--primary" type="button">Confirm</button>
  </div>
</section>
