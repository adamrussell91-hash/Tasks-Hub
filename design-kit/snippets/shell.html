<!DOCTYPE html>
<html lang="en" data-hub="knowledge">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hub</title>
    <link rel="icon" href="../icons/knowledge.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
    />
    <link rel="stylesheet" href="../css/tokens.css" />
    <link rel="stylesheet" href="../css/overlays.css" />
    <link rel="stylesheet" href="../css/chrome.css" />
  </head>
  <body>
    <div class="hub-layout">
      <aside class="hub-rail">
        <div class="hub-rail__brand-block">
          <!-- Always an <a> to hub home. Single line; CSS uppercases. See RAIL.md. -->
          <a class="hub-rail__brand" href="/">Knowledge Hub</a>
          <!-- Optional: <p class="hub-rail__tagline">Private dashboard</p> -->
        </div>
        <nav class="hub-rail__nav" aria-label="Hub">
          <a class="hub-rail__link" href="/" aria-current="page">
            <svg class="hub-rail__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 11.5 12 4l8 7.5" />
              <path d="M6 10.5V20h12v-9.5" />
            </svg>
            Home
          </a>
        </nav>
      </aside>
      <div class="hub-canvas">
        <header class="page-header">
          <div class="page-header__copy">
            <p class="page-header__eyebrow">Section</p>
            <h1 class="page-header__title">Page title</h1>
            <p class="page-header__supporting">One line of supporting copy.</p>
          </div>
          <div class="page-header__actions">
            <button class="btn btn--secondary" type="button">Secondary</button>
            <button class="btn btn--primary" type="button">Primary</button>
            <!-- Refresh + sign out: faded icons only. Copy from hub-utilities.html -->
            <div class="hub-utilities">
              <button class="hub-icon-btn" type="button" data-hub-refresh aria-label="Refresh" title="Refresh">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M21 12a9 9 0 1 1-2.6-6.3" />
                  <path d="M21 3v6h-6" />
                </svg>
              </button>
              <button class="hub-icon-btn" type="button" data-hub-sign-out aria-label="Sign out" title="Sign out">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M10 7V6a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-7a2 2 0 0 1-2-2v-1" />
                  <path d="M15 12H3" />
                  <path d="m7 8-4 4 4 4" />
                </svg>
              </button>
            </div>
            <img class="hub-mark" src="../icons/knowledge.svg" alt="" width="32" height="32" />
          </div>
        </header>
      </div>
    </div>
  </body>
</html>
