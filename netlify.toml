[build]
  # Vite only (no tsc) — a failing `npm run build` used to abort Functions deploys.
  # Same SPA as Pages, so Safari can sign in same-origin on tasks-api.
  command = "npx vite build && node scripts/copy-spa-fallback.mjs"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SITE_ORIGIN"
  NODE_VERSION = "22"
  VITE_API_BASE_URL = "https://tasks-api.adam-russell.com"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]
  included_files = ["config/clare-protocol.md", "fixtures/seed.json"]

# Functions own /api/*. Everything else is the Vite SPA so tasks-api
# is a same-origin app, not the old "Functions only" stub.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
